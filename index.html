<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clair de Lune · Visual Piano Navigation</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="clair-de-lune.css">
</head>
<body class="visual-page">
  <div class="visual-wrap">
    <!-- Header with piece info, bar position, and MIDI toolbar -->
    <header class="visual-header">
      <div class="header-left">
        <h1 class="page-title">Clair de lune</h1>
        <span class="page-subtitle">Claude Debussy · Visual Navigation</span>
      </div>

      <div class="header-controls">
        <div class="bar-step-badge" aria-live="polite">
          <span>Bar <strong id="bar-num">1</strong> / 72</span>
          <span>·</span>
          <span>Step <strong id="step-num">1</strong>/<span id="step-total">4</span></span>
        </div>

        <div class="step-btn-group" role="group" aria-label="Step navigation">
          <button type="button" class="step-btn" id="btn-prev" title="Previous event (Left Arrow or P)">Previous</button>
          <button type="button" class="step-btn" id="btn-next" title="Next event (Space, Right Arrow, or N)">Next</button>
          <button type="button" class="step-btn" id="btn-reset" title="Start over at Bar 1">Reset</button>
        </div>

        <div class="midi-select-wrap">
          <span class="midi-chip" id="midi-chip">MIDI…</span>
          <select id="midi-select" class="midi-select" aria-label="MIDI input device">
            <option value="">No MIDI device</option>
          </select>
        </div>
      </div>
    </header>

    <!-- 88-Key Region Minimap (Tertiary landmark orientation) -->
    <section class="minimap-section" aria-label="Full 88-key region minimap">
      <div class="minimap-caption">
        <span>88-Key Region Minimap</span>
        <span id="region-legend">Low Red (1–15) → High Pink (76–88) · Middle C is Green (40)</span>
      </div>
      <div class="minimap-container" id="minimap" role="region" aria-label="Keyboard regions">
        <!-- Generated by clair-de-lune.js -->
      </div>
    </section>

    <!-- Movement Cues (Secondary visual indicator: distance, direction, upcoming jump) -->
    <div class="movement-row" id="movement-row" aria-live="polite">
      <div class="movement-cues" id="movement-cues">
        <!-- Visual indicators per hand injected dynamically -->
      </div>
      <div class="mode-indicator">
        <span>Wait mode · Bright region-colored keys are the ones to play</span>
        <button type="button" class="key-num-toggle" id="btn-key-numbers" aria-pressed="false" title="Show piano key numbers 1–88">
          Show key numbers
        </button>
        <button type="button" class="key-num-toggle" id="btn-center-middle-c" aria-pressed="false" title="Keep the keyboard centered on Middle C (key 40)">
          Center on middle C
        </button>
      </div>
    </div>

    <!-- Primary Local Keyboard Stage (Dominant visual interface) -->
    <main class="local-stage" aria-label="Local keyboard playing area">
      <!-- Local Piano Keyboard (focused ~32 key window, centered on current notes) -->
      <div class="local-piano-scroll" id="piano-scroll">
        <div class="local-stage-inner" id="local-stage-inner">
          <!-- Region landmark color strip along top of local keys -->
          <div class="local-landmark-strip" id="landmark-strip">
            <!-- Color segments matching displayed regions -->
          </div>

          <!-- Note Target Lane (vertically aligned directly over physical keys) -->
          <div class="note-lane" id="note-lane">
            <!-- Current and upcoming note targets injected dynamically -->
          </div>

          <div class="local-piano" id="local-piano" role="img" aria-label="Interactive piano keyboard">
            <!-- White and black keys generated dynamically -->
          </div>
        </div>
      </div>
    </main>

    <!-- Tunable Experiment Parameters (Quiet, expandable panel) -->
    <details class="experiment-panel">
      <summary>Experiment Configuration & Tuning</summary>
      <div class="experiment-grid">
        <div class="experiment-field">
          <label for="cfg-window">Local Window Keys (default 32)</label>
          <input type="number" id="cfg-window" min="16" max="60" value="32">
        </div>
        <div class="experiment-field">
          <label for="cfg-jump">Large Jump Threshold (keys, default 12)</label>
          <input type="number" id="cfg-jump" min="6" max="24" value="12">
        </div>
        <div class="experiment-field">
          <label for="cfg-horizon">Upcoming Horizon Events (default 1)</label>
          <input type="number" id="cfg-horizon" min="1" max="3" value="1">
        </div>
      </div>
    </details>
  </div>

  <script src="region-helpers.js"></script>
  <script src="clair-de-lune.js"></script>
</body>
</html>
