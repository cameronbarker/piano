<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Practice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="visual-page">
  <div class="visual-wrap">
    <header class="visual-header">
      <div class="header-left">
        <h1 class="sr-only" id="page-title">Practice</h1>
        <div class="piece-picker">
          <label for="piece-select" class="piece-picker-label">Piece</label>
          <select id="piece-select" class="piece-select" aria-label="Choose a piece to practice"></select>
        </div>
        <span class="page-subtitle" id="page-subtitle"></span>
      </div>

      <div class="header-controls">
        <div class="bar-step-badge" aria-live="polite">
          <span>Bar <strong id="bar-num">1</strong> / <span id="bar-total">–</span></span>
          <span>·</span>
          <span>Step <strong id="step-num">1</strong>/<span id="step-total">4</span></span>
        </div>

        <div class="step-btn-group" role="group" aria-label="Step navigation">
          <button type="button" class="step-btn" id="btn-prev" title="Previous event (Left Arrow or P)">Previous</button>
          <button type="button" class="step-btn" id="btn-next" title="Next event (Space, Right Arrow, or N)">Next</button>
        </div>

        <button type="button" class="step-btn" id="btn-reset" title="Start over at Bar 1">Restart</button>

        <div class="midi-select-wrap">
          <span class="midi-chip" id="midi-chip">MIDI…</span>
          <select id="midi-select" class="midi-select" aria-label="MIDI input device">
            <option value="">No MIDI device</option>
          </select>
        </div>
      </div>
    </header>

    <div class="movement-row" id="movement-row" aria-live="polite">
      <div class="movement-cues" id="movement-cues">
        <!-- Visual indicators per hand injected dynamically -->
      </div>
      <div class="mode-indicator">
        <span id="mode-copy">Practice mode · Hold every highlighted key together to continue</span>
        <button type="button" class="key-num-toggle" id="btn-key-numbers" aria-pressed="false" title="Show piano key numbers 1–88">
          Show key numbers
        </button>
      </div>
    </div>

    <main class="local-stage" aria-label="Local keyboard playing area">
      <div class="local-piano-scroll" id="piano-scroll">
        <div class="local-stage-inner" id="local-stage-inner">
          <div class="local-landmark-strip" id="landmark-strip">
            <!-- Color segments matching displayed regions -->
          </div>

          <div class="note-lane" id="note-lane">
            <!-- Current and upcoming note targets generated dynamically -->
          </div>

          <div class="local-piano" id="local-piano" role="img" aria-label="Interactive piano keyboard">
            <!-- White and black keys generated dynamically -->
          </div>
        </div>
      </div>
    </main>

    <section class="phrase-panel" id="phrase-panel" aria-label="Upcoming phrase">
      <div class="phrase-toolbar">
        <div class="phrase-bar-stepper" role="group" aria-label="Bars to loop">
          <button type="button" class="phrase-btn" id="btn-loop-minus" aria-label="Fewer bars">−</button>
          <span class="phrase-bar-count" id="loop-bar-count">1 bar</span>
          <button type="button" class="phrase-btn" id="btn-loop-plus" aria-label="More bars">+</button>
        </div>
        <button type="button" class="phrase-btn phrase-btn-primary" id="btn-loop-these">Loop</button>
        <button type="button" class="phrase-btn" id="btn-loop-again" disabled>Again</button>
        <button type="button" class="phrase-btn" id="btn-loop-clear" disabled>Clear</button>
        <span class="phrase-status" id="phrase-status" aria-live="polite">Upcoming</span>
      </div>
      <div class="phrase-scroll" id="phrase-scroll">
        <div class="phrase-inner" id="phrase-inner" role="listbox" aria-label="Bars and steps" aria-multiselectable="false"></div>
      </div>
    </section>
  </div>

  <script src="region-helpers.js"></script>
  <script src="app.js"></script>
</body>
</html>
